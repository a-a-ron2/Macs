<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="theme-color" content="#1b1b19" />
<meta name="robots" content="noindex" />
<title>Fuel Log</title>
<style>
  :root {
    --ink: #1b1b19; --paper: #eeece5; --line: #35342f; --card: #232220; --edge: #3a3936;
    --mute: #6b685f; --soft: #8f8c80; --dim: #a7a49a;
    --steel: #4f6d7a; --steel-dim: #6f8b96; --rust: #a8563a; --gold: #b6862c; --sage: #7d8f5a;
    --mono: 'SF Mono', ui-monospace, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); }
  body.locked { overflow: hidden; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); }
  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .header h1 { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; margin: 0; }
  .header .actions { display: flex; gap: 6px; }
  .status { font-family: var(--mono); font-size: 11px; color: var(--mute); margin-bottom: 14px; overflow-wrap: anywhere; }
  .status.ok { color: var(--gold); } .status.err { color: var(--rust); }
  .hidden { display: none !important; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px; margin-bottom: 14px; }
  .panel h2, .sec-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); margin: 0 0 10px; font-weight: 700; }
  label.f { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--soft); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; background: var(--ink); border: 1px solid var(--edge); color: var(--paper); font-family: var(--mono); font-size: 16px; padding: 9px 10px; border-radius: 4px; }
  select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--soft) 50%), linear-gradient(135deg, var(--soft) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--steel-dim); }
  input[type=checkbox] { width: auto; }
  .hint { font-size: 12px; color: var(--mute); margin-top: 6px; line-height: 1.5; }
  .hint a { color: var(--steel-dim); }
  .err-text { color: var(--rust); font-family: var(--mono); font-size: 12px; margin-top: 8px; min-height: 14px; }

  .btn { font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 9px 12px; border-radius: 4px; cursor: pointer; border: 1px solid var(--edge); background: transparent; color: var(--dim); }
  .btn.sm { font-size: 12px; padding: 6px 10px; }
  .btn.primary { background: var(--steel); border-color: var(--steel); color: var(--ink); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .btn.danger { color: var(--rust); border-color: rgba(168,86,58,0.5); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: 0.5; }
  .btnrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btnrow > .btn { flex: 1; }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab { flex: 1; padding: 9px 6px; border-radius: 3px; border: 1px solid var(--edge); background: transparent; color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .tab.active { background: var(--steel); border-color: var(--steel); color: var(--ink); }

  .datebar { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  .datebar .btn { padding: 8px 12px; }
  .datebar input { flex: 1; text-align: center; font-size: 15px; }

  .totals .big { display: flex; align-items: baseline; justify-content: space-between; }
  .totals .kcal { font-family: var(--mono); font-size: 30px; font-weight: 700; }
  .totals .kcal small { font-size: 13px; color: var(--soft); font-weight: 400; }
  .bar { height: 5px; background: var(--ink); border-radius: 3px; overflow: hidden; margin: 8px 0 12px; }
  .bar > i { display: block; height: 100%; background: var(--gold); }
  .bar > i.over { background: var(--rust); }
  .macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .macro { background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 7px 6px; text-align: center; }
  .macro b { display: block; font-family: var(--mono); font-size: 15px; }
  .macro span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--soft); }
  .macro em { display: block; font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--mute); margin-top: 2px; }
  .minor { font-family: var(--mono); font-size: 11px; color: var(--soft); margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
  .card-head { padding: 11px 13px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
  .card-title { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .card-sub { font-family: var(--mono); font-size: 11px; color: var(--soft); margin-top: 2px; }
  .pill { font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 2px; white-space: nowrap; background: rgba(182,134,44,0.15); color: var(--gold); border: 1px solid rgba(182,134,44,0.4); }
  .pill.steel { background: rgba(79,109,122,0.18); color: var(--steel-dim); border-color: rgba(79,109,122,0.45); }
  .card-body { padding: 0 13px 12px; border-top: 1px solid var(--line); }
  .li { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 12px; padding: 5px 0; color: var(--dim); border-bottom: 1px dashed var(--line); }
  .li:last-of-type { border-bottom: none; }
  .li .d { color: var(--mute); white-space: nowrap; }
  .empty { font-family: var(--mono); font-size: 12px; color: var(--mute); padding: 6px 0; }
  .slot-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--mute); margin: 14px 0 6px; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); width: min(528px, calc(100% - 32px)); padding: 14px; background: var(--gold); color: var(--ink); border: none; border-radius: 4px; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.5); z-index: 5; }

  .week { display: flex; gap: 4px; align-items: flex-end; height: 70px; margin-top: 4px; }
  .week .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
  .week .col i { width: 100%; background: var(--steel); border-radius: 2px 2px 0 0; min-height: 2px; }
  .week .col.sel i { background: var(--gold); }
  .week .col span { font-family: var(--mono); font-size: 9px; color: var(--mute); margin-top: 3px; }
  .week-legend { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--mute); margin-top: 6px; }

  .search { margin-bottom: 10px; }

  /* sheet (full-screen editor) */
  .sheet { position: fixed; inset: 0; background: var(--ink); z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet .wrap { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; position: sticky; top: 0; background: var(--ink); padding: 6px 0 10px; z-index: 2; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 7px 11px; border-radius: 3px; border: 1px solid var(--edge); background: transparent; color: var(--dim); font-size: 12px; font-weight: 600; cursor: pointer; }
  .chip.active { background: var(--steel); border-color: var(--steel); color: var(--ink); }
  .row { display: grid; grid-template-columns: 1fr 78px 78px 30px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row .rm { background: none; border: none; color: var(--mute); font-size: 18px; cursor: pointer; padding: 0; }
  .row-meta { grid-column: 1 / -1; font-family: var(--mono); font-size: 11px; color: var(--mute); margin: -2px 0 6px 2px; }
  .row input, .row select { font-size: 14px; padding: 8px; }
  .row.gone { opacity: 0.6; }
  .live { font-family: var(--mono); font-size: 12px; color: var(--gold); margin-top: 10px; line-height: 1.6; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .nut-grid { display: grid; grid-template-columns: 1fr 110px; gap: 6px 10px; align-items: center; }
  .nut-grid label { font-size: 13px; color: var(--dim); }
  .nut-grid label.sub { padding-left: 14px; color: var(--soft); font-size: 12px; }
  .nut-grid input { text-align: right; }
  .preview { width: 100%; max-height: 260px; object-fit: contain; border-radius: 4px; border: 1px solid var(--line); background: #000; display: block; }
  .progress { height: 4px; background: var(--card); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress i { display: block; height: 100%; background: var(--steel-dim); transition: width .2s; }
  details { margin-top: 10px; }
  details summary { font-size: 11px; color: var(--soft); cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em; }
  pre.raw { white-space: pre-wrap; font-family: var(--mono); font-size: 11px; color: var(--dim); background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 8px; max-height: 220px; overflow: auto; }
  .seg { display: flex; border: 1px solid var(--edge); border-radius: 4px; overflow: hidden; }
  .seg button { flex: 1; background: transparent; border: none; color: var(--dim); padding: 9px 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .seg button.active { background: var(--steel); color: var(--ink); }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline > * { flex: 1; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top)); background: var(--card); border: 1px solid var(--gold); color: var(--gold); font-family: var(--mono); font-size: 12px; padding: 8px 14px; border-radius: 4px; z-index: 50; max-width: 90vw; text-align: center; }
  .toast.err { border-color: var(--rust); color: var(--rust); }
  .spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--mute); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Fuel Log</h1>
    <div class="actions">
      <button class="btn sm hidden" id="settingsBtn" data-act="openSettings">Settings</button>
    </div>
  </div>
  <div class="status" id="status">Locked</div>

  <!-- LOGIN -->
  <div id="login" class="panel">
    <h2>Unlock</h2>
    <div id="repoFields">
      <label class="f">GitHub username (repo owner)</label>
      <input id="lgOwner" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="your-burner-account" />
      <label class="f">Repo name</label>
      <input id="lgRepo" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="fuel-log" />
    </div>
    <div id="repoDetected" class="hint hidden"></div>
    <label class="f">Access token</label>
    <input id="lgToken" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…" />
    <label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="lgRemember" checked /> Remember on this device</label>
    <button class="btn primary block" style="margin-top:12px" id="lgBtn" data-act="login">Unlock</button>
    <div class="err-text" id="lgErr"></div>
    <div class="hint">Needs a fine-grained token scoped to <b>only this repo</b> with <b>Contents: Read and write</b>. The app checks the token can actually write to the repo before letting you in. The token is kept only in this browser and is sent only to api.github.com.</div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="tabs">
      <button class="tab" data-act="tab" data-tab="log">Log</button>
      <button class="tab" data-act="tab" data-tab="ingredients">Ingredients</button>
      <button class="tab" data-act="tab" data-tab="meals">Meals</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<button class="fab hidden" id="fab"></button>
<div class="sheet hidden" id="sheet"><div class="wrap" id="sheetInner"></div></div>
<input type="file" accept="image/*" capture="environment" id="camInput" class="hidden" />
<input type="file" accept="image/*" id="picInput" class="hidden" />

<script>
// Nutrition label text parser (works on OCR output). Shared by index.html and tests.
function parseLabel(raw) {
  let t = String(raw || "").replace(/\r/g, "");
  t = t.replace(/(\d),(\d)/g, "$1.$2");                       // 3,5g -> 3.5g
  t = t.replace(/(\d)[oO]/g, (m, d) => d + "0").replace(/[oO](\d)/g, (m, d) => "0" + d); // O misread as 0
  t = t.replace(/(^|[\s(\/<])[oO]\.(\d)/g, (m, a, d) => a + "0." + d);   // O.2g -> 0.2g
  t = t.replace(/(\d)\s*\.\s*(\d)/g, "$1.$2");
  t = t.replace(/\btrace\b/gi, "0g");
  const lines = t.split("\n").map(l => l.trim()).filter(Boolean);
  const low = lines.map(l => l.toLowerCase());
  const all = low.join("\n");

  function nums(s) {
    const out = [];
    const re = /(<\s*)?(\d+(?:\.\d+)?)[ \t]*(kcal|kj|mcg|µg|mg|g|ml|%)?/gi;
    let m;
    while ((m = re.exec(s))) {
      const u = (m[3] || "").toLowerCase();
      if (u === "%") continue;
      out.push({ v: parseFloat(m[2]), u });
    }
    return out;
  }
  const KEYS = /energy|calor|fat|saturat|carb|sugar|fib(re|er)|protein|salt|sodium/;
  function find(keyRe, excludeRe) {
    for (let i = 0; i < low.length; i++) {
      const l = low[i];
      const m = l.match(keyRe);
      if (!m || (excludeRe && excludeRe.test(l))) continue;
      let ns = nums(l.slice(m.index + m[0].length));
      if (!ns.length && i + 1 < low.length && !KEYS.test(low[i + 1])) ns = nums(low[i + 1]);
      if (ns.length) return ns[0];
    }
    return null;
  }
  const g = n => (n == null ? null : n.u === "mg" ? n.v / 1000 : (n.u === "mcg" || n.u === "µg") ? n.v / 1e6 : n.v);

  // ---- energy (kcal)
  let kcal = null;
  let m = all.match(/(\d+(?:\.\d+)?)[ \t]*k[ \t]*ca[l1i]/);
  if (m) kcal = parseFloat(m[1]);
  if (kcal == null) {
    const re = /(\d+(?:\.\d+)?)[ \t]*(?:kj)?[ \t]*[\/|][ \t]*(\d+(?:\.\d+)?)/g; let p;
    while ((p = re.exec(all))) { const a = +p[1], b = +p[2]; if (b > 0 && a / b > 3.9 && a / b < 4.5) { kcal = b; break; } }
  }
  if (kcal == null) { const n = find(/k[ \t]*ca[l1i]/); if (n) kcal = n.v; }
  if (kcal == null) { m = all.match(/(\d+(?:\.\d+)?)[ \t]*kj/); if (m) kcal = Math.round(parseFloat(m[1]) / 4.184); }
  if (kcal == null) { const n = find(/calories/, /from fat|a day|diet/); if (n) kcal = n.v; }

  const v = {
    kcal,
    fat: g(find(/\bfat\b|^fat|total[ \t]*fat/, /saturat|trans|mono|poly|calories/)),
    satfat: g(find(/saturate[sd]?|saturat/)),
    carbs: g(find(/carbohydrate|\bcarbs?\b|total[ \t]*carb/)),
    sugars: g(find(/sugars?/, /added|alcohol/)),
    fibre: g(find(/fib(re|er)/)),
    protein: g(find(/protein/)),
    salt: g(find(/\bsalt\b/)),
  };
  if (v.salt == null) { const s = find(/sodium/); if (s) v.salt = +(g(s) * 2.5).toFixed(2); }

  // ---- basis
  const per100 = /per[ \t]*100[ \t]*(g|ml)|100[ \t]*(g|ml)/.test(all);
  let servingG = null;
  const sl = low.find(l => /serving size/.test(l)) || low.find(l => /per serving|portion|serving/.test(l) && /\d[ \t]*(g|ml)\b/.test(l));
  if (sl) {
    const sm = sl.match(/\((\d+(?:\.\d+)?)[ \t]*(g|ml)\)/) || sl.match(/(\d+(?:\.\d+)?)[ \t]*(g|ml)\b/);
    if (sm) servingG = parseFloat(sm[1]);
  }
  const usStyle = /nutrition facts|serving size|amount per serving/.test(all);
  const basis = per100 ? "100" : (usStyle && servingG) ? "serving" : "100";
  const unitBase = /100[ \t]*ml|per[ \t]*\d*[ \t]*ml/.test(all) ? "ml" : "g";
  return { basis, servingG, unitBase, values: v };
}
</script>
<script>
"use strict";
// ---------- constants ----------
const API = "https://api.github.com";
const DATA_DIR = "data";
const SLOTS = ["Breakfast", "Lunch", "Dinner", "Snack"];
const NUT = [
  ["kcal", "Energy", "kcal", false],
  ["fat", "Fat", "g", false],
  ["satfat", "of which saturates", "g", true],
  ["carbs", "Carbohydrate", "g", false],
  ["sugars", "of which sugars", "g", true],
  ["fibre", "Fibre", "g", false],
  ["protein", "Protein", "g", false],
  ["salt", "Salt", "g", false],
];
const NKEYS = NUT.map(n => n[0]);
const LS_KEY = "fuellog_cfg";

// ---------- state ----------
let cfg = null;            // {owner, repo, branch, token}
const SHA = {};
const DB = { ingredients: [], meals: [], settings: { targets: {} }, logs: {} };
let tab = "log";
let curDate = todayStr();
let filter = "";
let ED = null;   // composer state (entry/meal)
let IED = null;  // ingredient editor state
let ocrWorker = null;

// ---------- utils ----------
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).slice(0, 12); }
function pad(n) { return String(n).padStart(2, "0"); }
function dstr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function todayStr() { return dstr(new Date()); }
function addDays(s, n) { const [y, m, d] = s.split("-").map(Number); return dstr(new Date(y, m - 1, d + n)); }
function prettyDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const rel = s === todayStr() ? "Today · " : s === addDays(todayStr(), -1) ? "Yesterday · " : "";
  return rel + dt.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
}
function num(v) { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; }
function r1(n) { return Math.round(n * 10) / 10; }
function fmtN(k, v) { if (v == null || !isFinite(v)) return "—"; return k === "kcal" ? String(Math.round(v)) : k === "salt" ? (Math.round(v * 100) / 100).toString() : r1(v).toString(); }
function zero() { const o = {}; NKEYS.forEach(k => o[k] = 0); return o; }
function addN(a, b) { NKEYS.forEach(k => a[k] += (b && b[k]) || 0); return a; }
function scaleN(per100, g) { const o = {}; NKEYS.forEach(k => o[k] = ((per100 && per100[k]) || 0) * g / 100); return o; }
function roundN(n) { const o = {}; NKEYS.forEach(k => o[k] = Math.round((n[k] || 0) * 1000) / 1000); return o; }
function ingById(id) { return DB.ingredients.find(i => i.id === id); }
function mealById(id) { return DB.meals.find(m => m.id === id); }
function sortByName(a) { return [...a].sort((x, y) => x.name.localeCompare(y.name, undefined, { sensitivity: "base" })); }
function setStatus(t, cls) { const s = $("status"); s.textContent = t; s.className = "status" + (cls ? " " + cls : ""); }
let toastTimer;
function toast(msg, err) {
  let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); document.body.appendChild(t); }
  t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), err ? 4500 : 2200);
}
function b64enc(str) { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64dec(b64) { const bin = atob(b64.replace(/\s/g, "")); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }

// ---------- GitHub API ----------
async function gh(path, opts = {}, token = cfg && cfg.token) {
  const headers = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  if (opts.body) headers["Content-Type"] = "application/json";
  return fetch(API + path, { cache: "no-store", ...opts, headers });
}
const repoPath = () => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;
const filePath = p => DATA_DIR + "/" + p;

async function readJSON(p, fallback) {
  const res = await gh(`${repoPath()}/contents/${filePath(p)}?ref=${encodeURIComponent(cfg.branch)}`);
  if (res.status === 404) { SHA[p] = null; return structuredClone(fallback); }
  if (res.status === 401) { lockOut("Token rejected by GitHub (expired or revoked)"); throw new Error("Unauthorised"); }
  if (!res.ok) throw new Error("GitHub read error " + res.status);
  const j = await res.json();
  SHA[p] = j.sha;
  let text;
  if (j.content) text = b64dec(j.content);
  else { // >1MB files: fetch raw blob
    const b = await gh(`${repoPath()}/git/blobs/${j.sha}`); text = b64dec((await b.json()).content);
  }
  try { return JSON.parse(text); } catch { throw new Error("Corrupt JSON in " + p); }
}
async function writeJSON(p, data, msg) {
  const body = { message: msg, content: b64enc(JSON.stringify(data, null, 1) + "\n"), branch: cfg.branch };
  if (SHA[p]) body.sha = SHA[p];
  const res = await gh(`${repoPath()}/contents/${filePath(p)}`, { method: "PUT", body: JSON.stringify(body) });
  if (res.status === 409 || res.status === 422) { const e = new Error("conflict"); e.conflict = true; throw e; }
  if (res.status === 401) { lockOut("Token rejected by GitHub"); throw new Error("Unauthorised"); }
  if (res.status === 403 || res.status === 404) throw new Error("This token can't write to the repo (" + res.status + ")");
  if (!res.ok) throw new Error("GitHub write error " + res.status);
  const j = await res.json(); SHA[p] = j.content.sha;
}
// Always re-read before writing, apply change, retry on conflict.
async function updateJSON(p, fallback, mutate, msg) {
  if (!cfg) throw new Error("Not unlocked");
  for (let attempt = 0; attempt < 3; attempt++) {
    const data = await readJSON(p, fallback);
    mutate(data);
    try { await writeJSON(p, data, msg); return data; }
    catch (e) { if (!e.conflict || attempt === 2) throw e; await new Promise(r => setTimeout(r, 400)); }
  }
}

// ---------- auth ----------
function detectRepo() {
  const h = location.hostname;
  if (!h.endsWith(".github.io")) return null;
  const owner = h.split(".")[0];
  const seg = location.pathname.split("/").filter(Boolean)[0];
  const repo = seg && !seg.includes(".") ? seg : h;
  return { owner, repo };
}

async function verifyAndUnlock(owner, repo, token, branchPref) {
  const tmp = { owner, repo, token };
  const rp = `/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
  let res;
  try { res = await gh(rp, {}, token); } catch { throw new Error("Network error — can't reach GitHub"); }
  if (res.status === 401) throw new Error("GitHub rejected this token (wrong, expired or revoked)");
  if (res.status === 404 || res.status === 403) throw new Error("This token can't see " + owner + "/" + repo);
  if (!res.ok) throw new Error("GitHub error " + res.status);
  const info = await res.json();
  // Write probe: creating a loose git blob needs Contents write access but changes nothing visible.
  const probe = await gh(rp + "/git/blobs", { method: "POST", body: JSON.stringify({ content: "fuel-log auth check", encoding: "utf-8" }) }, token);
  if (probe.status !== 201) throw new Error("Token is valid but has no write access to " + owner + "/" + repo + " — give it Contents: Read and write");
  tmp.branch = branchPref || "data";
  cfg = tmp;
  await ensureBranch(cfg.branch, info.default_branch);
  return cfg;
}
async function ensureBranch(branch, fromBranch) {
  const r = await gh(`${repoPath()}/git/ref/heads/${encodeURIComponent(branch)}`);
  if (r.ok) return;
  if (r.status !== 404) throw new Error("Couldn't check data branch (" + r.status + ")");
  const base = await gh(`${repoPath()}/git/ref/heads/${encodeURIComponent(fromBranch)}`);
  if (!base.ok) throw new Error("Couldn't read default branch " + fromBranch);
  const sha = (await base.json()).object.sha;
  const c = await gh(`${repoPath()}/git/refs`, { method: "POST", body: JSON.stringify({ ref: "refs/heads/" + branch, sha }) });
  if (!c.ok && c.status !== 422) throw new Error("Couldn't create data branch (" + c.status + ")");
}

function saveCfg(remember) {
  const s = JSON.stringify(cfg);
  localStorage.removeItem(LS_KEY); sessionStorage.removeItem(LS_KEY);
  (remember ? localStorage : sessionStorage).setItem(LS_KEY, s);
}
function loadCfg() { try { return JSON.parse(localStorage.getItem(LS_KEY) || sessionStorage.getItem(LS_KEY) || "null"); } catch { return null; } }
function lockOut(msg) {
  cfg = null;
  localStorage.removeItem(LS_KEY); sessionStorage.removeItem(LS_KEY);
  DB.ingredients = []; DB.meals = []; DB.logs = {}; DB.settings = { targets: {} };
  closeSheet();
  $("app").classList.add("hidden"); $("fab").classList.add("hidden"); $("settingsBtn").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("lgToken").value = "";
  setStatus(msg || "Locked", msg ? "err" : "");
}

async function doLogin() {
  const det = detectRepo();
  const owner = det ? det.owner : $("lgOwner").value.trim();
  const repo = det ? det.repo : $("lgRepo").value.trim();
  const token = $("lgToken").value.trim();
  $("lgErr").textContent = "";
  if (!owner || !repo || !token) { $("lgErr").textContent = "Fill in all fields"; return; }
  const btn = $("lgBtn"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking token…';
  try {
    const prev = loadCfg();
    await verifyAndUnlock(owner, repo, token, prev && prev.owner === owner && prev.repo === repo ? prev.branch : null);
    saveCfg($("lgRemember").checked);
    await enterApp();
  } catch (e) {
    cfg = null; $("lgErr").textContent = e.message;
  } finally { btn.disabled = false; btn.textContent = "Unlock"; }
}

async function enterApp() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden"); $("settingsBtn").classList.remove("hidden");
  setStatus("Loading…");
  try {
    const [ing, meals, settings] = await Promise.all([
      readJSON("ingredients.json", []), readJSON("meals.json", []), readJSON("settings.json", { targets: {} }),
    ]);
    DB.ingredients = ing; DB.meals = meals; DB.settings = settings; DB.settings.targets = DB.settings.targets || {};
    await ensureDays(weekDates(curDate));
    render();
  } catch (e) { if (cfg) setStatus("Load failed: " + e.message, "err"); }
}

// ---------- logs ----------
const monthOf = d => d.slice(0, 7);
const logPath = m => `log/${m}.json`;
async function ensureMonth(m, force) {
  if (DB.logs[m] && !force) return DB.logs[m];
  DB.logs[m] = await readJSON(logPath(m), {});
  return DB.logs[m];
}
async function ensureDays(dates) { const ms = [...new Set(dates.map(monthOf))]; await Promise.all(ms.map(m => ensureMonth(m))); }
function dayEntries(d) { const m = DB.logs[monthOf(d)]; return (m && m[d]) || []; }
function entryTotals(e) { const t = zero(); (e.items || []).forEach(it => addN(t, it.n)); return t; }
function dayTotals(d) { const t = zero(); dayEntries(d).forEach(e => addN(t, entryTotals(e))); return t; }
function weekDates(end) { const a = []; for (let i = 6; i >= 0; i--) a.push(addDays(end, -i)); return a; }

// ---------- rendering ----------
function render() {

  if (tab === "ingredients") { renderIngredients(); fab.textContent = "📷  Scan a nutrition label"; fab.dataset.act = "scan"; }
  if (tab === "meals") { renderMeals(); fab.textContent = "+ New saved meal"; fab.dataset.act = "newMeal"; }
}

function macroBox(label, k, v, target) {
  const sub = target ? `<em>/ ${fmtN(k, target)}</em>` : "";
  return `<div class="macro"><b>${fmtN(k, v)}</b><span>${label}</span>${sub}</div>`;
}

function renderLog() {
  const T = DB.settings.targets || {};
  const tot = dayTotals(curDate);
  const entries = dayEntries(curDate).slice().sort((a, b) => (SLOTS.indexOf(a.slot) + 1 || 9) - (SLOTS.indexOf(b.slot) + 1 || 9) || (a.time || "").localeCompare(b.time || ""));
  const pct = T.kcal ? Math.min(100, tot.kcal / T.kcal * 100) : 0;
  let h = `<div class="datebar">
      <button class="btn" data-act="day" data-d="-1">‹</button>
      <input type="date" id="datePick" value="${curDate}" />
      <button class="btn" data-act="day" data-d="1">›</button>
      ${curDate !== todayStr() ? '<button class="btn sm" data-act="today">Today</button>' : ""}
    </div>
    <div class="panel totals">
      <div class="big"><div class="kcal">${fmtN("kcal", tot.kcal)} <small>kcal${T.kcal ? " / " + T.kcal : ""}</small></div>
      <div class="card-sub">${prettyDate(curDate)}</div></div>
      ${T.kcal ? `<div class="bar"><i class="${tot.kcal > T.kcal ? "over" : ""}" style="width:${pct}%"></i></div>` : '<div style="height:10px"></div>'}
      <div class="macros">
        ${macroBox("Protein", "protein", tot.protein, T.protein)}
        ${macroBox("Carbs", "carbs", tot.carbs, T.carbs)}
        ${macroBox("Fat", "fat", tot.fat, T.fat)}
        ${macroBox("Fibre", "fibre", tot.fibre, T.fibre)}
      </div>
      <div class="minor"><span>sugars ${fmtN("sugars", tot.sugars)}g</span><span>sat fat ${fmtN("satfat", tot.satfat)}g</span><span>salt ${fmtN("salt", tot.salt)}g</span></div>
    </div>`;
  if (!entries.length) h += `<div class="empty" style="text-align:center;padding:18px 0">Nothing logged for this day yet.</div>`;
  let lastSlot = null;

    const t = entryTotals(e);
    const title = e.title || (e.items || []).map(i => i.name).slice(0, 3).join(", ") + ((e.items || []).length > 3 ? "…" : "");
    h += `<div class="card"><div class="card-head" data-act="toggle">
        <div><div class="card-title">${esc(title || "Entry")}</div>
        <div class="card-sub">P ${fmtN("protein", t.protein)} · C ${fmtN("carbs", t.carbs)} · F ${fmtN("fat", t.fat)}${e.time ? " · " + esc(e.time) : ""}</div></div>
        <div class="pill">${fmtN("kcal", t.kcal)} kcal</div></div>
      <div class="card-body hidden">
        ${(e.items || []).map(i => `<div class="li"><span>${esc(i.name)}</span><span class="d">${esc(i.label || r1(i.g) + "g")} · ${fmtN("kcal", i.n && i.n.kcal)} kcal</span></div>`).join("")}
        <div class="btnrow">
          <button class="btn sm" data-act="editEntry" data-id="${e.id}">Edit</button>
          <button class="btn sm" data-act="entryToMeal" data-id="${e.id}">Save as meal</button>
          <button class="btn sm danger" data-act="delEntry" data-id="${e.id}">Delete</button>
        </div>
      </div></div>`;
  });

  const wk = weekDates(curDate).map(d => ({ d, k: dayTotals(d).kcal }));
  const max = Math.max(T.kcal || 0, ...wk.map(w => w.k), 1);
  const logged = wk.filter(w => w.k > 0);
  const avg = logged.length ? logged.reduce((a, w) => a + w.k, 0) / logged.length : 0;
  h += `<div class="panel" style="margin-top:16px"><h2>Last 7 days</h2>
    <div class="week">${wk.map(w => `<div class="col ${w.d === curDate ? "sel" : ""}" data-act="goto" data-date="${w.d}"><i style="height:${Math.max(2, w.k / max * 100)}%"></i><span>${"SMTWTFS"[new Date(w.d + "T12:00").getDay()]}</span></div>`).join("")}</div>
    <div class="week-legend"><span>avg ${Math.round(avg)} kcal (${logged.length} days logged)</span><span>max ${Math.round(Math.max(...wk.map(w => w.k)))}</span></div></div>`;
  $("view").innerHTML = h;
  $("datePick").onchange = e => { if (e.target.value) gotoDate(e.target.value); };
}

function itemLabel(ing, g, mode, qty) {
  if (mode === "unit" && ing && ing.unit) return `${r1(qty)} ${ing.unit.name}${qty == 1 ? "" : "s"}`;
  return `${r1(g)}${(ing && ing.base) || "g"}`;
}
function rowGrams(r) { const ing = ingById(r.ing); if (!ing) return 0; return r.mode === "unit" && ing.unit ? num(r.qty) * ing.unit.g : num(r.qty); }
function rowN(r) { if (r.snap) return r.snap.n; const ing = ingById(r.ing); return ing ? scaleN(ing.per100, rowGrams(r)) : zero(); }
function defaultSlot() { const h = new Date().getHours(); return h < 11 ? "Breakfast" : h < 15 ? "Lunch" : h < 17 ? "Snack" : "Dinner"; }
function newRow(ingId) { const ing = ingById(ingId); return { key: uid(), ing: ingId || "", qty: ing && ing.unit ? 1 : 100, mode: ing && ing.unit ? "unit" : "g" }; }
function rowsFromMeal(m, portion) {
  const rows = []; let skipped = 0;
  (m.items || []).forEach(it => {
    if (!ingById(it.ing)) { skipped++; return; }
    const mode = it.mode === "unit" && ingById(it.ing).unit ? "unit" : "g";
    rows.push({ key: uid(), ing: it.ing, mode, qty: mode === "unit" ? r1((it.qty || 1) * portion) : r1(it.g * portion) });
  });
  if (skipped) toast(skipped + " ingredient(s) in that meal were deleted and were skipped", true);
  return rows;
}

async function saveComposer() {
  if (ED.saving) return;
  const rows = ED.rows.filter(r => r.snap || (r.ing && num(r.qty) > 0));

async function saveIng() {

  const per100 = {}; NKEYS.forEach(k => per100[k] = Math.round(num(s.vals[k] ?? 0) * factor * 1000) / 1000);
  if (!per100.kcal && !per100.protein && !per100.carbs && !per100.fat) { if (!confirm("All the main values are 0. Save anyway?")) return; }

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load OCR engine — check your connection")); document.head.appendChild(s); }); }
async function getWorker(onProgress) {
  if (!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
  if (!ocrWorker) {
    ocrWorker = await Tesseract.createWorker("eng", 1, { logger: m => onProgress && onProgress(m) });
  }

let progressHook = null;
async function prepImage(file) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Couldn't open that image")); i.src = url; });
  const longSide = Math.max(img.naturalWidth, img.naturalHeight);
  const scale = Math.min(2400 / longSide, longSide < 1400 ? 2 : 1);
  const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true }); ctx.drawImage(img, 0, 0, w, h);
  // grayscale + contrast stretch
  const d = ctx.getImageData(0, 0, w, h); const p = d.data; const hist = new Uint32Array(256);
  for (let i = 0; i < p.length; i += 4) { const g = (p[i] * 0.299 + p[i + 1] * 0.587 + p[i + 2] * 0.114) | 0; p[i] = g; hist[g]++; }
  const total = w * h; let acc = 0, lo = 0, hi = 255;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > total * 0.02) { lo = i; break; } }
  acc = 0; for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > total * 0.02) { hi = i; break; } }
  const range = Math.max(1, hi - lo);
  for (let i = 0; i < p.length; i += 4) { const v = Math.max(0, Math.min(255, (p[i] - lo) * 255 / range)); p[i] = p[i + 1] = p[i + 2] = v; }
  ctx.putImageData(d, 0, 0);
  // small preview of the original
  const pc = document.createElement("canvas"); const ps = Math.min(1, 900 / longSide);
  pc.width = Math.round(img.naturalWidth * ps); pc.height = Math.round(img.naturalHeight * ps);
  pc.getContext("2d").drawImage(img, 0, 0, pc.width, pc.height);
  URL.revokeObjectURL(url);
  return { canvas: c, preview: pc.toDataURL("image/jpeg", 0.8) };
}
async function handlePhoto(file) {
  if (!file) return;
  if (!IED) openIngEditor(null);
  const s = IED;
  s.scanning = true; s.progress = 0; s.phase = "Preparing photo…"; renderIngEditor();
  try {
    const { canvas, preview } = await prepImage(file);
    s.img = preview; s.phase = "Loading OCR engine (first time takes a moment)…"; renderIngEditor();
    progressHook = m => {
      if (IED !== s) return;
      s.phase = m.status === "recognizing text" ? "Reading label…" : "Loading OCR engine…";
      s.progress = m.progress || 0;
      const bar = document.querySelector(".progress i"); if (bar) bar.style.width = Math.round(s.progress * 100) + "%";
      const lbl = document.querySelector(".sheet .card-sub"); if (lbl) lbl.innerHTML = `<span class="spinner"></span>${esc(s.phase)} ${Math.round(s.progress * 100)}%`;
    };
    const w = await getWorker(m => progressHook && progressHook(m));
    const { data } = await w.recognize(canvas);
    if (IED !== s) return;
    const parsed = parseLabel(data.text);
    s.raw = data.text;
    s.basis = parsed.basis; s.base = parsed.unitBase;
    if (parsed.servingG) s.servingG = parsed.servingG;
    let found = 0;
    NKEYS.forEach(k => { if (parsed.values[k] != null) { s.vals[k] = parsed.values[k]; found++; } });
    if (parsed.basis === "serving" && parsed.servingG && !s.unitName) { s.unitName = "serving"; s.unitG = parsed.servingG; }
    s.scanning = false; renderIngEditor();
    toast(found ? `Found ${found}/8 values — please check them` : "Couldn't read values — try a closer, flatter, well-lit photo", !found);
  } catch (e) {
    if (IED === s) { s.scanning = false; renderIngEditor(); }
    toast(e.message, true);
  }
}

async function exportCsv() {

  const files = r.ok ? (await r.json()).filter(f => /\d{4}-\d{2}\.json$/.test(f.name)) : [];
  await Promise.all(files.map(f => ensureMonth(f.name.replace(".json", ""), true)));
  const lines = ["date,time,slot,entry,ingredient,amount,grams," + NKEYS.join(",")];
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  Object.keys(DB.logs).sort().forEach(m => Object.keys(DB.logs[m]).sort().forEach(d => DB.logs[m][d].forEach(e => (e.items || []).forEach(it =>
    lines.push([d, e.time, e.slot, e.title, it.name, it.label, it.g, ...NKEYS.map(k => r1((it.n || {})[k] || 0))].map(q).join(","))))));
  const blob = new Blob([lines.join("\n") + "\n"], { type: "text/csv" });

}

  if (saved && saved.token) {
    if (!det) { $("lgOwner").value = saved.owner; $("lgRepo").value = saved.repo; }
    if (det && (det.owner.toLowerCase() !== saved.owner.toLowerCase() || det.repo.toLowerCase() !== saved.repo.toLowerCase())) { lockOut(); return; }
    setStatus("Checking saved token…");
    $("login").classList.add("hidden");
    try {
      await verifyAndUnlock(saved.owner, saved.repo, saved.token, saved.branch);
      await enterApp();
    } catch (e) {
      cfg = null;
      if (e.message.startsWith("Network")) {   // offline: keep token, let user retry
        $("login").classList.remove("hidden"); $("lgToken").value = saved.token;
        $("lgRemember").checked = !!localStorage.getItem(LS_KEY);
        setStatus("Offline? Couldn't reach GitHub — tap Unlock to retry", "err");
      } else lockOut("Saved token no longer works: " + e.message);
    }
  } else {
    setStatus("Locked — enter a repo access token to continue");
  }
})();
</script>
</body>
</html>
